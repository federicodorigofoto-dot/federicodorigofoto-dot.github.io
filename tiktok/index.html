<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Collegamento TikTok | Occhio Selvaggio</title>
    <style>
        :root { --bg: #f6f4ef; --fg: #1d1d1b; --muted: #6b6a66; --box: #ffffff; --line: #d9d6cf; --accent: #2f5d3a; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #141513; --fg: #ecebe6; --muted: #a3a29c; --box: #1f201d; --line: #3a3b36; --accent: #8fc79c; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { color: var(--muted); margin: 0 0 16px; }
        .code { display: flex; gap: 8px; margin: 24px 0 8px; }
        input { flex: 1; min-width: 0; padding: 12px; font: 14px ui-monospace, Consolas, monospace; color: var(--fg); background: var(--box); border: 1px solid var(--line); border-radius: 8px; }
        button { padding: 12px 16px; font: inherit; font-weight: 600; color: var(--bg); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
        .error { color: #c0392b; }
        footer { margin-top: 40px; font-size: 0.875rem; color: var(--muted); }
        footer a { color: inherit; }
    </style>
</head>
<body>
<main>
    <h1 id="title">Collegamento TikTok</h1>
    <p id="text">Questa pagina riceve il codice di autorizzazione di TikTok per l'app «Occhio Selvaggio». Non salva e non invia niente: mostra il codice solo a te.</p>
    <div class="code" id="box" hidden>
        <input id="code" readonly aria-label="Codice di autorizzazione">
        <button type="button" id="copy">Copia</button>
    </div>
    <p id="hint" hidden>Incolla il codice nel programma entro qualche minuto: scade presto e vale una volta sola.</p>
    <footer><a href="../privacy.html">Privacy e termini</a></footer>
</main>
<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var error = params.get("error");
        var title = document.getElementById("title");
        var text = document.getElementById("text");
        if (code) {
            title.textContent = "Autorizzazione riuscita";
            text.textContent = "Ecco il codice per collegare il tuo account TikTok al programma.";
            document.getElementById("code").value = code;
            document.getElementById("box").hidden = false;
            document.getElementById("hint").hidden = false;
            document.getElementById("copy").addEventListener("click", function () {
                var field = document.getElementById("code");
                field.select();
                var done = function () { document.getElementById("copy").textContent = "Copiato"; };
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(field.value).then(done, function () { document.execCommand("copy"); done(); });
                } else {
                    document.execCommand("copy");
                    done();
                }
            });
        } else if (error) {
            title.textContent = "Autorizzazione non riuscita";
            text.textContent = "TikTok ha risposto: " + error + (params.get("error_description") ? " (" + params.get("error_description") + ")" : "") + ".";
            text.className = "error";
        }
    })();
</script>
</body>
</html>
